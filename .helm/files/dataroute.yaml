apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # name must match the spec fields below, and be in the form: <plural>.<group>
  name: dataroutes.pushstream.sneaksanddata.com
spec:
  # group name to use for REST API: /apis/<group>/<version>
  group: pushstream.sneaksanddata.com
  scope: Namespaced
  names:
    plural: dataroutes
    singular: dataroute
    kind: DataRoute
    shortNames:
      - dr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - consumerId
                - schemaSubject
                - schemaVersion
              properties:
                consumerId:
                  type: string
                  description: |
                    Identifier of the consumer this route belongs to. Determines the URL path
                    segment exposed by the ingestion server, i.e.
                    POST /api/<apiVersion>/<consumerId>/data
                  pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
                  minLength: 1
                  maxLength: 63
                payloadSchema:
                  type: string
                  description: |
                    Optional Apache Avro schema (a record schema), serialized as a JSON string,
                    that incoming request payloads for this route must validate against before
                    being enqueued. The server parses this string into an Avro Schema once at
                    load time, then for each request:
                      1. infers the Avro union branch tag for every value that needs one, so
                         request bodies are plain JSON ({"reading": 1.5}) rather than Avro's
                         own JSON encoding ({"reading": {"double": 1.5}}); bodies already
                         written in the tagged form are accepted unchanged,
                      2. decodes the result with Avro's JSON decoder against this schema, which
                         validates the payload; every field the schema declares must be present,
                      3. stores the request body as JSON in the DynamoDB `payload` attribute.
                         The decoded record is used for validation only -- persisting Avro binary
                         would leave the stored document unreadable to consumers, which read it
                         back as JSON.
                    If set, `schemaSubject` and `schemaVersion` must also be provided so the
                    downstream parquet writer can resolve the writer schema.
                  minLength: 1
                jsonExpressionPointer:
                  type: string
                  description: |
                    Optional RFC 6901 JSON Pointer selecting the part of the request body that
                    carries the data, e.g. `/payload`.
                    The request body is stored whole — the pointer is applied by the consumer, not
                    at ingestion — so a route whose pointer changes can be re-streamed from the
                    records already persisted. It is published on the target table as the
                    `json-pointer-expression` property, which is where arcane-stream-pull reads it
                    from, since the PullStream CRD has no field to configure it with.
                    The pointed-at node's top-level fields are "hoisted" into one iceberg column
                    each: scalars keep their own type, while a nested record, map or array becomes
                    a single `variant` column. Without it the request body's own top-level fields
                    become the columns, and a field named `id` is provisioned as `push_event_id`.
                    A request whose body does not contain the pointer is rejected with
                    400 "application error: invalid json path for payload".
                    Must start with `/`; the empty string means the document root and is
                    equivalent to omitting the field.
                    Like all table properties it is written at creation time only: changing it on
                    a route whose table already exists needs the property updated by hand.
                  pattern: '^(/[^/]*)*$'
                schemaSubject:
                  type: string
                  description: |
                    Logical name of the Avro schema family bound to this route (e.g. "orders").
                    Persisted as the DynamoDB `schemaSubject` attribute on every item so the
                    downstream consumer can route to the correct schema family.
                  pattern: '^[a-zA-Z_][a-zA-Z0-9_.-]{0,127}$'
                  minLength: 1
                  maxLength: 128
                schemaVersion:
                  type: integer
                  description: |
                    Monotonically increasing version of the Avro schema within `schemaSubject`.
                    Persisted as the DynamoDB `schemaVersion` (Number) attribute on every item.
                  minimum: 1
                iceberg:
                  type: object
                  description: |
                    Optional Iceberg target table definition. When set, the ingestion service
                    ensures the referenced table exists in the REST catalog at startup (and
                    whenever a new DataRoute is observed). Tables are created idempotently:
                    if the table already exists, the spec is left untouched. Schema-evolution
                    checks are intentionally deferred — this initial implementation only handles
                    the create-if-missing case.
                  required: [catalogUri, warehouse, namespace, tableName]
                  properties:
                    catalogUri:
                      type: string
                      description: REST catalog endpoint URI (e.g. http://lakekeeper:20001/catalog).
                      minLength: 1
                    warehouse:
                      type: string
                      description: Warehouse identifier registered in the catalog.
                      minLength: 1
                    namespace:
                      type: string
                      description: Namespace under which the table is created (created on demand if missing).
                      minLength: 1
                    tableName:
                      type: string
                      description: Table name within the namespace.
                      pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
                      minLength: 1
                      maxLength: 128
                    columns:
                      type: array
                      description: |
                        Ordered list of columns. Optional: when `payloadSchema` is set the columns
                        are derived from it and this list is ignored, which keeps the table in step
                        with the schema producers actually push. Supply it only for routes without
                        a `payloadSchema`.
                        When derived, each root field of the payload record becomes one column:
                        scalars keep their own type, while a nested `record`, `map` or `array`
                        becomes a single `variant` column holding the document as sent, because
                        its shape is not known until a message arrives.
                        With a `jsonExpressionPointer` set, the columns are derived from the record
                        that pointer selects instead of from the payload root, matching the document
                        that ingestion actually persists.
                        Field-ids are assigned sequentially starting at 1 in declaration order;
                        do not change ordering after creation.
                        The `timestampUTC` and `arcane_merge_key` columns are appended automatically
                        — the arcane-stream-pull plugin writes both, and its MERGE fails without the
                        latter — so they never need to be declared here.
                      minItems: 1
                      items:
                        type: object
                        required: [name, type]
                        properties:
                          name:
                            type: string
                            minLength: 1
                          type:
                            type: string
                            description: |
                              Logical Iceberg type. Supported values:
                              string, int, long, double, float, boolean, binary, date,
                              timestamp (UTC-adjusted), variant.
                              A table declaring a `variant` column is created with
                              `format-version: "3"`, since variant is not part of the v2 spec.
                              Readers of that table must support Iceberg v3.
                            enum: [string, int, long, double, float, boolean, binary, date, timestamp, variant]
                          required:
                            type: boolean
                            default: false
                    initialProperties:
                      type: object
                      description: |
                        Optional key/value table properties seeded once at creation time.
                        Ignored if the table already exists. Keys and values are passed
                        verbatim to Iceberg's UpdateProperties API.
                        If `comment` is not given, the provisioner seeds
                        `{"timestamp":"1970-01-01T00:00:00Z"}`. arcane-stream-pull parses
                        the entire comment as its watermark JSON and refuses to start when
                        it is missing or not JSON, so this makes the consumer replay the
                        table from the beginning rather than fail. Note there is no
                        `watermark:` prefix -- the comment is the JSON document itself.
                        Set `comment` explicitly to start from a later point.
                      additionalProperties:
                        type: string
      additionalPrinterColumns:
        - name: Consumer
          type: string
          jsonPath: .spec.consumerId
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
